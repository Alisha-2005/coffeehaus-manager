# CoffeeHaus Manager application settings

# JSP view resolver configuration
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:coffeehausdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create tables automatically
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 web console for debugging at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# App name
spring.application.name=coffeehaus-manager
